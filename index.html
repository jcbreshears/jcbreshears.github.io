<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Moved to Skeg Software</title>

  <!-- This portfolio now lives at skegsoftware.com. GitHub Pages cannot issue a
       real 301, so this page does the next best thing: a canonical pointing at
       the new home (so search engines consolidate rather than treat the two as
       duplicates), a meta refresh, and a JS replace() that leaves no history
       entry to bounce back into.

       Deliberately NOT deleted. Proposals already sent to clients cite this
       URL, and turning those into 404s would be worse for whoever reads them
       later than leaving a page that forwards. -->
  <link rel="canonical" href="https://skegsoftware.com/" />
  <meta name="robots" content="noindex, follow" />
  <meta http-equiv="refresh" content="0; url=https://skegsoftware.com/" />

  <style>
    :root { color-scheme: dark light; }
    body {
      margin: 0; min-height: 100vh;
      display: grid; place-items: center; padding: 2rem;
      background: #101a2e; color: #edf1f7;
      font: 400 1rem/1.6 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    .card { max-width: 34rem; display: grid; gap: 1rem; }
    h1 { margin: 0; font-size: clamp(1.5rem, 1.2rem + 1.4vw, 2.1rem); letter-spacing: -.02em; }
    p { margin: 0; color: #7d8ca8; }
    a.go {
      justify-self: center; margin-top: .5rem;
      display: inline-block; padding: .8rem 1.35rem; border-radius: .5rem;
      /* Dark ink on the green, never white: white on #8a9461 is 3.24:1. */
      background: #8a9461; color: #101a2e;
      font-weight: 650; text-decoration: none;
    }
    a.go:hover, a.go:focus-visible { background: #a8b37a; }
  </style>
</head>
<body>
  <main class="card">
    <h1>This portfolio has moved</h1>
    <p>The work now lives at <strong>skegsoftware.com</strong>, along with everything else the studio builds.</p>
    <a class="go" href="https://skegsoftware.com/">Go to skegsoftware.com</a>
  </main>
  <script>location.replace("https://skegsoftware.com/");</script>
</body>
</html>
